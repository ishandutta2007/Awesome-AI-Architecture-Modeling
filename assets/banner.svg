<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Filter for glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-subtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6"/>
      <circle cx="40" cy="40" r="1.5" fill="#334155" opacity="0.7"/>
    </pattern>

    <!-- Pulse Animation -->
    <style>
      .pulse-line {
        stroke-dasharray: 8, 12;
        animation: dash 25s linear infinite;
      }
      .pulse-node {
        animation: pulse 3s ease-in-out infinite alternate;
      }
      .node-slow {
        animation: pulse 4s ease-in-out infinite alternate;
      }
      .float-card {
        animation: float 6s ease-in-out infinite alternate;
      }
      @keyframes dash {
        to {
          stroke-dashoffset: -1000;
        }
      }
      @keyframes pulse {
        0% { r: 5px; opacity: 0.4; }
        100% { r: 8px; opacity: 0.9; }
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" fill="url(#bg-grad)" rx="16"/>
  <rect width="1200" height="360" fill="url(#grid)" rx="16"/>

  <!-- Subtle Dynamic Architecture Background Flows (Behind text) -->
  <g opacity="0.45">
    <!-- Connecting Architecture Lines -->
    <path d="M 100 80 Q 300 20 600 70 T 1100 50" fill="none" stroke="#0284c7" stroke-width="2" class="pulse-line" />
    <path d="M 50 280 Q 350 340 700 290 T 1150 260" fill="none" stroke="#7c3aed" stroke-width="2" class="pulse-line" />
    <path d="M 200 320 C 450 180 750 360 1050 200" fill="none" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="4, 8" />

    <!-- Architecture Nodes -->
    <circle cx="100" cy="80" r="6" fill="#38bdf8" class="pulse-node" filter="url(#glow)"/>
    <circle cx="600" cy="70" r="7" fill="#818cf8" class="node-slow" filter="url(#glow)"/>
    <circle cx="1100" cy="50" r="6" fill="#38bdf8" class="pulse-node" filter="url(#glow)"/>
    <circle cx="50" cy="280" r="6" fill="#c084fc" class="node-slow" filter="url(#glow)"/>
    <circle cx="700" cy="290" r="8" fill="#ec4899" class="pulse-node" filter="url(#glow)"/>
    <circle cx="1150" cy="260" r="6" fill="#a855f7" class="node-slow" filter="url(#glow)"/>
  </g>

  <!-- Subtle Ambient Glow Orbs in Corners -->
  <circle cx="950" cy="70" r="140" fill="#6366f1" opacity="0.12" filter="url(#glow)"/>
  <circle cx="200" cy="300" r="130" fill="#06b6d4" opacity="0.1" filter="url(#glow)"/>

  <!-- Foreground Foreground Container - Title & Subtitle Always Clear -->
  <g id="foreground-content">
    <!-- Top Pill Badge -->
    <g transform="translate(430, 36)">
      <rect width="340" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1.2" opacity="0.95"/>
      <circle cx="20" cy="17" r="5" fill="#10b981" filter="url(#glow-subtle)"/>
      <text x="35" y="22" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" letter-spacing="1">
        CURATED ECOSYSTEM &amp; PLATFORMS
      </text>
    </g>

    <!-- Main Title -->
    <text x="600" y="145" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="800" fill="url(#title-grad)" letter-spacing="-0.5" filter="url(#glow-subtle)">
      Awesome AI Architecture &amp; Modeling
    </text>

    <!-- Subtitle -->
    <text x="600" y="195" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#cbd5e1" letter-spacing="0.2">
      Enterprise SaaS &amp; Open-Source Tools for C4 Modeling, System Diagrams &amp; Code-to-Architecture
    </text>

    <!-- Feature Tags / Metric Badges (Foreground Row) -->
    <g transform="translate(165, 238)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="180" height="42" rx="10" fill="#0f172a" stroke="#0284c7" stroke-width="1.2" opacity="0.95"/>
        <text x="90" y="26" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">
          📐 C4 Architecture Models
        </text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(200, 0)">
        <rect width="190" height="42" rx="10" fill="#0f172a" stroke="#6366f1" stroke-width="1.2" opacity="0.95"/>
        <text x="95" y="26" text-anchor="middle" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">
          ⚡ Architecture-as-Code
        </text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(410, 0)">
        <rect width="210" height="42" rx="10" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.2" opacity="0.95"/>
        <text x="105" y="26" text-anchor="middle" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">
          🤖 Agent-Driven Mapping
        </text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(640, 0)">
        <rect width="230" height="42" rx="10" fill="#0f172a" stroke="#ec4899" stroke-width="1.2" opacity="0.95"/>
        <text x="115" y="26" text-anchor="middle" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">
          🏢 Enterprise EA Platforms
        </text>
      </g>
    </g>

    <!-- Bottom Stat Bar -->
    <text x="600" y="325" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#64748b" letter-spacing="0.5">
      Verified Pricing Models • Exact Free Tier Limits • GitHub Stargazer Rankings
    </text>
  </g>
</svg>
